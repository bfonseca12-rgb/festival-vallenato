<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - Festival Vallenato</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- Franja Tricolor Colombia -->
    <div style="height: 8px; background: linear-gradient(to right, #FFCD00 50%, #003087 25%, #C8102E 25%);"></div>

    <div class="container py-5" style="max-width: 500px;">
        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-header text-white text-center py-4" style="background-color: #0b6623;">
                <h3>🪗 Crear Cuenta</h3>
                <p class="m-0 small">Regístrate para votar en el Festival Vallenato</p>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-warning w-100 fw-bold mt-3 shadow-sm">Registrarme e Iniciar Sesión</button>
                </form>
                <div class="text-center mt-3">
                    <a href="{% url 'login' %}" class="text-decoration-none">¿Ya tienes cuenta? Inicia sesión aquí</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
