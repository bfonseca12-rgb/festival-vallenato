                <div class="card card-custom p-4">
                    <div class="text-center mb-3">
                        <span class="fs-1">🪗</span>
                        <h3 class="fw-bold text-dark">Iniciar Sesión</h3>
                        <p class="text-muted small">Festival de la Leyenda Vallenata 2027</p>
                    </div>
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            {{ form.as_p }}
