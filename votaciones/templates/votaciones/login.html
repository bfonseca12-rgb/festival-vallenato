<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Festival Vallenato 2027</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪗</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-image: url('https://i.imgur.com/vHqLqL7.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-custom {
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            border: 2px solid #003893;
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body>
    <div class="container my-4">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card card-custom p-4">
                    <div class="text-center mb-3">
                        <span class="fs-1">🪗</span>
                        <h3 class="fw-bold text-dark">Iniciar Sesión</h3>
                        <p class="text-muted small">Festival de la Leyenda Vallenata 2027</p>
                    </div>
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            {{ form.as_p }}
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold py-2" style="background-color: #003893; border: none;">Ingresar</button>
                    </form>
                    <div class="text-center mt-3 border-top pt-2">
                        <a href="{% url 'registro' %}" class="text-decoration-none me-3 small">¿No tienes cuenta? Regístrate</a>
                        <br>
                        <a href="/" class="text-decoration-none text-secondary small mt-1 d-inline-block">← Volver al Inicio</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
