<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Festival Vallenato 2027</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪗</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow-x: hidden;
            background-color: #fcd116;
        }

        .bg-colombia-img {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -1;
        }

        .card-custom {
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 3px solid #003893;
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body>

    <!-- Imagen de fondo estática -->
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/21/Flag_of_Colombia.svg/1280px-Flag_of_Colombia.svg.png" class="bg-colombia-img" alt="Bandera de Colombia">

    <div class="container my-4">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card card-custom p-4">
                    <div class="text-center mb-3">
                        <span class="fs-1">🪗</span>
                        <h3 class="fw-bold text-dark">Registro de Usuario</h3>
                        <p class="text-muted small">Regístrate para votar por tu candidato preferido</p>
                    </div>
                    <form method="POST">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-warning w-100 fw-bold py-2 mt-2">Crear Cuenta</button>
                    </form>
                    <div class="text-center mt-3 border-top pt-2">
                        <a href="{% url 'login' %}" class="text-decoration-none me-3 small">¿Ya tienes cuenta? Inicia sesión</a>
                        <br>
                        <a href="/" class="text-decoration-none text-secondary small mt-1 d-inline-block">← Volver al Inicio</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
