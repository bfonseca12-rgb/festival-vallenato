{% for opcion in votacion.opciones.all %}
  <div class="col-md-4 mb-4">
    <div class="card h-100 text-center shadow-sm">
      
      <!-- Foto del cantante -->
      {% if opcion.imagen %}
        <img src="{{ opcion.imagen.url }}" class="card-img-top" alt="{{ opcion.nombre }}" style="max-height: 250px; object-fit: cover;">
      {% endif %}

      <div class="card-body d-flex flex-column justify-content-between">
        <h5 class="card-title fw-bold">{{ opcion.nombre }}</h5>
        
        <!-- Muestra de música (MP3) -->
        {% if opcion.audio %}
          <div class="my-2">
            <audio controls class="w-100">
              <source src="{{ opcion.audio.url }}" type="audio/mpeg">
              Tu navegador no soporta el reproductor de audio.
            </audio>
          </div>
        {% endif %}

        <!-- Botón para votar -->
        <form action="{% url 'votar' opcion.id %}" method="POST" class="mt-2">
          {% csrf_token %}
          <button type="submit" class="btn btn-warning w-100 fw-bold">Votar</button>
        </form>
      </div>

    </div>
  </div>
{% endfor %}
